# ============================================
# Project configuration file
# ============================================

[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ cookiecutter.project_slug }}"
# version now handled dynamically by setuptools-scm
dynamic = ["version"]

description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
authors = [
  { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }
]
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "astropy",
  "spectral-cube",
  "pyyaml",
  "tqdm",
  "typer",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
notebook = ["notebook", "ipykernel"]

[project.urls]
Homepage = "https://github.com/your-username/{{ cookiecutter.project_slug }}"

[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.package_name }}.cli:app"

# ============================================
# setuptools / packaging
# ============================================
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ============================================
# setuptools-scm (auto version from git tags)
# ============================================
[tool.setuptools_scm]
# Accept tags like v0.1.0 or 0.1.0
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"
write_to = "src/{{ cookiecutter.package_name }}/_version.py"

# ============================================
# Ruff (lint + format + import sorting)
# ============================================
[tool.ruff]
line-length = 99
target-version = "py{{ cookiecutter.python_version | replace('.', '') }}"
exclude = ["__pycache__", "data", ".venv", "env", "notebooks", "_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203", "E266", "E501"]

[tool.ruff.format]
# Defaults are fine: 4-space indent, double quotes, line endings auto.
